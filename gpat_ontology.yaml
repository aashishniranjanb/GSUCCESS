  name: "Graduate Pharmacy Aptitude Test"
  target_year: 2027
  authority: "NBEMS"
  status: "pending_official_2027_bulletin"
  provisional_reference:
    exam_version: "GPAT_2026"
    status: "baseline_only"

curriculum_versions:
