# GPAT 2027 / B.Pharm Knowledge Ontology — V0
# STATUS:
# - This is a candidate ontology for the learning system.
# - It is NOT an assertion of the official GPAT 2027 blueprint.
# - GPAT 2027 exam rules/weighting must be activated only after the official NBEMS bulletin.
# - B.Pharm_2026_NEP2020 is treated as a current curriculum source/version, not automatically as GPAT 2027.
#
# Source hierarchy:
#   official_exam > official_curriculum > primary_academic > standard_textbook >
#   verified_educational > user_material > ai_generated
#
# Design principle:
#   Subject -> Topic -> Subtopic -> Concept -> Claim/Question/Relationship
#
ontology_version: "0.1.0"

exam:
